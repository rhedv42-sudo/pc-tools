ShortDescription: Free, open-source all-in-one maintenance tool for Windows – updates, cleanup, health score, backup, BitLocker assistant and remote family help.
Description: |-
  PC-Tools keeps Windows maintained, secure and fast – much of it with one click.
  Health score with traffic light and one-click fixes, Windows, app (winget), driver and BIOS updates, cleanup and boot-time analysis, security checks and password leak check, file and full-image backup, BitLocker assistant with recovery-key PDF, "Get help" and "My PCs" for family helpers (also via Home Assistant and an Android app), simple mode for beginners and an optional AI assistant.
  12 languages, no telemetry, no ads.
