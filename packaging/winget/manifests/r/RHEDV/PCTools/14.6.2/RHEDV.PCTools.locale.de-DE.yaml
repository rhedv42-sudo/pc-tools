ShortDescription: Kostenloses Open-Source-Wartungswerkzeug für Windows – Updates, Aufräumen, Zustands-Score, Datensicherung, BitLocker-Assistent und Fernhilfe.
Description: |-
  PC-Tools hält Windows gepflegt, sicher und schnell – vieles mit einem Klick.
  Zustands-Score mit Ampel und „Punkte beheben“, Windows-, Programm- (winget), Treiber- und BIOS-Updates, Aufräumen und Startzeit-Analyse, Sicherheitsprüfung und Passwort-Check, Datensicherung und Komplettsicherung, BitLocker-Assistent mit Schlüssel-PDF, „Hilfe holen“ und „Meine PCs“ für Familien-Helfer (auch mit Home Assistant und Android-App), Einfach-Modus für Einsteiger und optionaler KI-Assistent.
  12 Sprachen, keine Telemetrie, keine Werbung.
