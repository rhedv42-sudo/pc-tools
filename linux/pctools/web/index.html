<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PC-Tools für Linux</title>
<link rel="icon" href="icon-64.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="nav" id="nav">
    <div class="brand">
      <img src="icon-64.png" alt="" width="32" height="32">
      <div><b>PC-Tools</b><small data-t="für Linux">für Linux</small></div>
    </div>
    <nav>
      <button data-page="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span data-t="Übersicht">Übersicht</span></button>
      <button data-page="updates"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span data-t="Updates">Updates</span></button>
      <button data-page="cleanup"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg><span data-t="Aufräumen">Aufräumen</span></button>
      <button data-page="autostart"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/></svg><span data-t="Autostart">Autostart</span></button>

      <button data-page="netdiag"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span data-t="Netzwerk-Diagnose">Netzwerk-Diagnose</span></button>

      <button data-page="ai"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><span data-t="KI-Assistent">KI-Assistent</span></button>
      <button data-page="settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span data-t="Einstellungen">Einstellungen</span></button>

  <main>
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Menü"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="page-title">PC-Tools</h1>
      <span id="busy" class="busy" hidden></span>

    <div id="banner" class="banner" hidden></div>
    <div id="content" class="content"><p class="muted" data-t="Wird geladen …">Wird geladen …</p></div>

<dialog id="dlg">
  <form method="dialog">
    <h2 id="dlg-title"></h2>
    <div id="dlg-body"></div>
    <div class="dlg-actions" id="dlg-actions"></div>
  </form>
</dialog>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>

</html>
