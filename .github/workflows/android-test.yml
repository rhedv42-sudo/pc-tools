name: Android-App Starttest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-test.yml']

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [36, 34, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: APK bauen
        working-directory: android
        run: gradle assembleRelease --no-daemon -q
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: App im Emulator starten
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/android-starttest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starttest-api${{ matrix.api }}
          path: starttest/
      - name: Bildschirmfotos in Zweig ci-screens ablegen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d starttest ] || exit 0
          R=${{ github.repository }}
          gh api -X POST repos/$R/git/refs -f ref=refs/heads/ci-screens -f sha=${{ github.sha }} >/dev/null 2>&1 || true
          grep -h "pctools\|PcTools\|AndroidRuntime" starttest/logcat*.txt | tail -80 > starttest/log.txt || true
          for f in starttest/*.png starttest/log.txt starttest/crash.txt; do
            [ -f "$f" ] || continue
            dest="api${{ matrix.api }}-$(basename "$f")"
            old=$(gh api "repos/$R/contents/$dest?ref=ci-screens" --jq .sha 2>/dev/null || true)
            base64 -w0 "$f" > /tmp/b64
            if [ -n "$old" ]; then
              gh api -X PUT "repos/$R/contents/$dest" -f message="Starttest $dest" -f branch=ci-screens -f sha="$old" -F content=@/tmp/b64 >/dev/null && echo "::notice::abgelegt $dest" || echo "::warning::nicht abgelegt $dest"
            else
              gh api -X PUT "repos/$R/contents/$dest" -f message="Starttest $dest" -f branch=ci-screens -F content=@/tmp/b64 >/dev/null && echo "::notice::abgelegt $dest" || echo "::warning::nicht abgelegt $dest"
            fi
          done
