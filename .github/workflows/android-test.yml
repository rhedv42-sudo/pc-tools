name: Android-App Starttest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-test.yml']

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [36, 34, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: APK bauen
        working-directory: android
        run: gradle assembleRelease --no-daemon -q
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: App im Emulator starten
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/android-starttest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starttest-api${{ matrix.api }}
          path: starttest/
      - name: Bildschirmfotos in Zweig ci-screens ablegen
        if: always()
        run: |
          [ -d starttest ] || exit 0
          mkdir -p /tmp/shots && for f in starttest/*.png; do [ -f "$f" ] && cp "$f" "/tmp/shots/api${{ matrix.api }}-$(basename "$f")"; done
          cp starttest/crash.txt "/tmp/shots/api${{ matrix.api }}-crash.txt" 2>/dev/null || true
          grep -h "PcTools\|de.rh.pctools" starttest/logcat*.txt | tail -60 > "/tmp/shots/api${{ matrix.api }}-log.txt" || true
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          for i in 1 2 3; do
            rm -rf /tmp/cs && git clone -q --depth 1 -b ci-screens "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/cs 2>/dev/null || { mkdir -p /tmp/cs && cd /tmp/cs && git init -q && git checkout -q -b ci-screens && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"; cd - >/dev/null; }
            cp /tmp/shots/* /tmp/cs/ && cd /tmp/cs && git add -A && git commit -q -m "Starttest API ${{ matrix.api }} ${{ github.sha }}" && git push -q origin ci-screens && break
            cd - >/dev/null; sleep $((RANDOM % 10 + 5))
          done
