name: Release (bauen, signieren, veröffentlichen)

# Läuft, wenn ein Tag wie v13.7 gepusht wird.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:   # GitHub > Actions > Release > "Run workflow" - Version kommt aus $AppVersion

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version prüfen
        id: ver
        shell: pwsh
        run: |
          $av = (Select-String -Path PCPflege.ps1 -Pattern "^\`$AppVersion = '([^']+)'").Matches[0].Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}'.TrimStart('v') -ne $av) { throw "Tag passt nicht zu `$AppVersion $av." }
          "version=$av" >> $env:GITHUB_OUTPUT

      # ---- Signatur über SignPath (nur wenn eingerichtet: Variable SIGNPATH_ORGANIZATION_ID + Secret SIGNPATH_API_TOKEN)
      - name: Unsigniertes Skript bereitstellen
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: PCPflege.ps1

      - name: Signieren (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'pc-tools'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'ps1'
          github-artifact-id: '${{ steps.unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed'

      - name: Signierte Fassung übernehmen
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: Copy-Item signed/PCPflege.ps1 PCPflege.ps1 -Force

      - name: Starter PC-Tools.exe bauen
        shell: pwsh
        run: ./launcher/Build-Launcher.ps1 -Version '${{ steps.ver.outputs.version }}' -Out dist

      - name: Pakete bauen
        shell: pwsh
        run: ./build/Build-Packages.ps1 -Out dist

      - name: Installationsprogramm bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSrcDir=$PWD" "/DOutDir=$PWD\dist" installer\PC-Tools.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup fehlgeschlagen' }


      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PC-Tools ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/*.exe
            dist/version.json
            PCPflege.ps1

      # ---- Selbstupdate: Zweig "stable" enthält nur veröffentlichte (ggf. signierte) Stände
      - name: Zweig stable aktualisieren
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Copy-Item dist/version.json version.json -Force
          git checkout -B stable
          git add -f PCPflege.ps1 version.json lang
          git commit -m "Release v${{ steps.ver.outputs.version }}" --allow-empty
          git push -f origin stable

  # ---- Linux-Ausgabe: tar.gz + .deb auf Ubuntu bauen und an dasselbe Release hängen
  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests und Pakete
        run: |
          cd linux
          PCTOOLS_TEST_ALLOW_ROOT=1 python3 -m unittest discover -s tests
          sh build/build-packages.sh
          ls -la dist
      - name: An das Release anhängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            linux/dist/*.tar.gz
            linux/dist/*.deb
