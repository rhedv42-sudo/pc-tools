name: Übersetzungsfehler / Translation error
description: Ein Text ist falsch oder unverständlich übersetzt
labels: [übersetzung]
body:
  - type: input
    id: sprache
    attributes:
      label: Sprache / Language
      placeholder: z.B. English, Français, Polski
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Falscher Text und Vorschlag / Wrong text and suggestion
      description: Wo steht der Text (Seite/Knopf), wie lautet er, wie wäre es richtig?
    validations:
      required: true
